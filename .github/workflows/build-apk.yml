# Сборка APK. Запускается, когда в репозитории создают тег вида v1.0.0 (или вручную).
# Готовый APK появляется в разделе Releases репозитория.
name: Сборка APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы создать Release
  actions: write    # нужно, чтобы после выпуска запустить публикацию сайта (на сайте лежит копия APK)
# Сторонние действия (subosito, softprops) закреплены по отпечатку коммита, а не по имени версии: так их нельзя подменить задним числом.
# Чтобы обновить, найдите новый отпечаток: gh api repos/<автор>/<действие>/commits/<версия> --jq .sha

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      # Встроенная копия расписания: если на сайте ещё ничего нет, приложение сразу покажет данные.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Свежая копия расписания в приложение
        run: |
          pip install -r ../data/requirements.txt
          (cd ../data && python -m schedule_parser --out public --previous "")
          bash ../scripts/sync_app_assets.sh

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test

      # Ключ подписи (по желанию): если в Settings → Secrets заданы все четыре секрета, APK подписывается ими.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            printf 'storeFile=../release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "APK будет подписан вашим ключом"
          else
            echo "Секретов подписи нет — APK подпишется отладочным ключом"
          fi

      - name: Сборка
        run: |
          # Системная версия (видна в «Настройки → Приложения») и номер сборки, который только растёт (нужен магазинам приложений).
          # Ручной запуск не с тега (ветка main) получает версию 0.0.0, чтобы сборка не падала.
          NAME="${GITHUB_REF_NAME#v}"
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then NAME="0.0.0"; fi
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$NAME" --build-number=${{ github.run_number }} \
            --dart-define=SCHEDULE_BASE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ \
            --dart-define=APP_VERSION=${GITHUB_REF_NAME#v}

      - name: Переименовать
        run: cp build/app/outputs/flutter-apk/app-release.apk unigraf.apk

      # Ключ подписи больше не нужен: стираем его с диска ДО шагов со сторонними действиями (выпуск, загрузка файла),
      # чтобы они не могли его прочитать. Выполняется, даже если сборка упала.
      - name: Стереть ключ подписи
        if: always()
        run: rm -f android/release.jks android/key.properties

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: app/unigraf.apk
          generate_release_notes: true

      # Выпуск, созданный из задачи, сам другие задачи не запускает, поэтому запускаем публикацию сайта вручную:
      # она положит новый APK на сайт.
      - name: Обновить сайт
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-schedule.yml --repo "${{ github.repository }}" --ref main

      - name: APK как файл задачи (для ручного запуска)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: unigraf-apk
          path: app/unigraf.apk
